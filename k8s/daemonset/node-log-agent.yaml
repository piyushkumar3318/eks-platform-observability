apiVersion: apps/v1
kind: DaemonSet
metadata:
name: node-log-agent
namespace: kube-system
spec:
selector:
matchLabels:
app: node-log-agent
template:
metadata:
labels:
app: node-log-agent
spec:
containers:
- name: log-agent
image: busybox
command: ["/bin/sh", "-c"]
args:
- while true; do tail -n 20 /var/log/syslog; sleep 30; done
volumeMounts:
- name: varlog
mountPath: /var/log
volumes:
- name: varlog
hostPath:
path: /var/log